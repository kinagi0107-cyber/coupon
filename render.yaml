# Render デプロイ設定ファイル
# Web Service (Node.js + React) と PostgreSQL データベースの構成

databases:
  # PostgreSQL データベース（無料プラン）
  - name: coupon-db
    plan: free
    region: oregon

services:
  # Web サーバー（Express + React 静的ファイル配信）
  - type: web
    name: coupon-system
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "cd server && npm install && npm run build && cd ../client && npm install && npm run build && cd ../server && npx prisma migrate deploy"
    startCommand: "cd server && npm start"
    envVars:
      # データベース接続URL（Render が自動的に設定）
      - key: DATABASE_URL
        fromDatabase:
          name: coupon-db
          property: connectionString
      # Node.js 環境設定
      - key: NODE_ENV
        value: production
      # 管理者認証情報（Render ダッシュボードから上書き可能）
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: nanaehama2611
      # JWT署名シークレット（デプロイ時に自動生成）
      - key: JWT_SECRET
        generateValue: true
